image: node:20

stages:
  - build

build:
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  # No unit tests yet — this build step acts as a smoke test that
  # catches syntax errors and broken imports on every push/MR.
